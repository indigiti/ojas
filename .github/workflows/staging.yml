name: OJAS staging
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  staging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - name: PHP syntax and API integration tests
        run: |
          find apps/api -name '*.php' -print0 | xargs -0 -n1 php -l
          bash tests/api-smoke.sh
      - name: Validate Python syntax
        run: python3 -m py_compile services/coach/main.py
      - name: Build static web app
        working-directory: apps/web
        env:
          NEXT_PUBLIC_BASE_PATH: /ojas
        run: |
          npm install --no-audit --no-fund
          npm run build
          test -f out/index.html
      - name: Package DigiOps release
        run: bash deploy/digiops/package.sh
      - name: Smoke-test packaged release under Apache
        run: bash tests/digiops-smoke.sh
      - name: Upload DigiOps release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: digiops-release
          path: release/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
